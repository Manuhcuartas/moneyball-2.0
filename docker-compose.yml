services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: moneyball_user
      POSTGRES_PASSWORD: moneyball_password
      POSTGRES_DB: moneyball_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: moneyball_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: moneyball_frontend
    # Mapeamos el volumen para trabajar en caliente
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - WATCHPACK_POLLING=true # A veces necesario en WSL2
    stdin_open: true # Necesario para React
    tty: true

volumes:
  postgres_data:
